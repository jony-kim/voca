<style>
:root{
  --bg:#f4f5fa; --card:#fff; --ink:#171a23; --sub:#6b7280; --line:#e7e8ef;
  --brand:#635bff; --brand2:#8b7dff; --ok:#0ea472; --okbg:#e6f7f1;
  --no:#e6395c; --nobg:#fdecef; --warn:#f59e0b;
  --sh:0 2px 14px rgba(20,20,50,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1016;--card:#181b25;--ink:#eceef5;--sub:#9aa1b1;--line:#262a37;
  --okbg:#0e2a20;--nobg:#2b1119;--sh:0 2px 14px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",Segoe UI,Roboto,sans-serif;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px;
  padding-top:calc(14px + env(safe-area-inset-top))}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- nav ---------- */
nav{display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex:none}
nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--sub);
  font-size:10.5px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}

/* ---------- common ---------- */
h1{font-size:21px;margin:2px 0 2px;letter-spacing:-.4px}
h2{font-size:15px;margin:22px 0 10px;letter-spacing:-.2px}
.muted{color:var(--sub);font-size:12.5px;margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.btn{display:block;width:100%;padding:15px;border-radius:15px;border:0;font-size:16px;font-weight:700;
  font-family:inherit;background:var(--brand);color:#fff;cursor:pointer;letter-spacing:-.2px}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:600;font-size:14.5px;padding:13px}
.btn.sm{padding:10px;font-size:13.5px;border-radius:12px}
.row{display:flex;gap:9px}
.row>*{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);
  color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.lv1{background:var(--okbg);color:var(--ok);border-color:transparent}
.lv2{background:#eef0ff;color:#5b57e8;border-color:transparent}
.lv3{background:#fff2e0;color:#c2760a;border-color:transparent}
@media (prefers-color-scheme:dark){.lv2{background:#1e2140;color:#a49dff}.lv3{background:#2e2312;color:#e9a94b}}

/* ---------- home ---------- */
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:none}
.ring .big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.ring .lbl{font-size:12.5px;color:var(--sub);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:var(--card);border-radius:15px;padding:13px 8px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:19px;letter-spacing:-.5px}
.stat span{font-size:11px;color:var(--sub)}
.streak{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line);font-size:13.5px}

/* ---------- study ---------- */
#study{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;flex-direction:column;max-width:560px;margin:0 auto}
#study.on{display:flex}
.stop{display:flex;align-items:center;gap:11px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.bar{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.stop .x{background:none;border:0;font-size:24px;color:var(--sub);cursor:pointer;padding:0 2px;line-height:1}
.stop .n{font-size:12.5px;color:var(--sub);font-weight:700;min-width:44px;text-align:right}
.wrap{flex:1;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column}
.wcard{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:26px 20px;text-align:center;flex:none}
.emo{font-size:76px;line-height:1;margin-bottom:14px}
.word{font-size:36px;font-weight:800;letter-spacing:-1px;word-break:break-word;line-height:1.15}
.tags{display:flex;gap:6px;justify-content:center;margin-top:11px}
.say{display:flex;gap:9px;justify-content:center;margin-top:18px}
.say button{padding:10px 15px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);
  font-size:13px;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:5px}
.say button:active{background:var(--brand);color:#fff;border-color:var(--brand)}
.reveal{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);text-align:left}
.mean{font-size:22px;font-weight:800;letter-spacing:-.4px;text-align:center;margin-bottom:16px}
.ex{background:var(--bg);border-radius:14px;padding:13px}
.ex .en{font-size:15px;line-height:1.5;font-weight:600}
.ex .ko{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}
.ex .sayex{display:flex;gap:7px;margin-top:11px}
.ex .sayex button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-family:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tapme{margin-top:18px;padding:13px;border-radius:14px;background:var(--bg);color:var(--sub);
  font-size:13.5px;font-weight:600;text-align:center;border:1.5px dashed var(--line);cursor:pointer}
.ans{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex:none}
.ans button{flex:1;padding:17px;border-radius:17px;border:0;font-size:16px;font-weight:800;
  font-family:inherit;cursor:pointer;letter-spacing:-.3px}
.ans .no{background:var(--nobg);color:var(--no)}
.ans .yes{background:var(--okbg);color:var(--ok)}
.ans button:active{transform:scale(.97)}
.done{text-align:center;padding:34px 10px}
.done .m{font-size:70px}
.done h3{font-size:23px;margin:14px 0 6px;letter-spacing:-.5px}

/* ---------- list ---------- */
.search{width:100%;padding:12px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--card);font-size:15px;font-family:inherit;color:var(--ink);margin-bottom:11px}
.search:focus{outline:none;border-color:var(--brand)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;
  padding:11px 13px;margin-bottom:7px;box-shadow:var(--sh);cursor:pointer}
.item .e{font-size:27px;flex:none;width:34px;text-align:center}
.item .t{flex:1;min-width:0}
.item .t b{font-size:15.5px;letter-spacing:-.2px;display:block}
.item .t span{font-size:12.5px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{flex:none;font-size:19px}
.more{text-align:center;color:var(--sub);font-size:13px;padding:14px}

/* ---------- calendar ---------- */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhd button{background:var(--card);border:0;width:36px;height:36px;border-radius:11px;
  font-size:17px;color:var(--ink);cursor:pointer;box-shadow:var(--sh)}
.calhd b{font-size:17px;letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:11px;color:var(--sub);font-weight:700;padding-bottom:5px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:12.5px;background:var(--card);color:var(--sub);position:relative;gap:1px}
.day.empty{background:none}
.day.today{outline:2px solid var(--brand);outline-offset:-2px}
.day.part{background:#fff5df;color:#a86a06}
.day.full{background:var(--ok);color:#fff;font-weight:800}
.day .k{font-size:13px;line-height:1}
@media (prefers-color-scheme:dark){.day.part{background:#33280f;color:#e5b45c}}
.legend{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:11.5px;color:var(--sub)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:4px;vertical-align:-1px}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:60;display:none;align-items:flex-end;
  justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
label.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-size:14.5px}
input[type=range]{width:100%;accent-color:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#171a23;color:#fff;padding:11px 18px;border-radius:13px;font-size:13.5px;font-weight:600;
  z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.95}
</style>
</head>
<body>

<div id="app">
<main>

<!-- ============ HOME ============ -->
<section class="view on" id="v-home">
  <h1>중1 보카 3000</h1>
  <p class="muted" id="today"></p>

  <div class="card" style="margin-top:14px">
    <div class="ring">
      <svg width="94" height="94" viewBox="0 0 94 94">
        <circle cx="47" cy="47" r="39" fill="none" stroke="var(--line)" stroke-width="11"/>
        <circle id="ringp" cx="47" cy="47" r="39" fill="none" stroke="var(--brand)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="245" stroke-dashoffset="245"
          transform="rotate(-90 47 47)" style="transition:stroke-dashoffset .5s"/>
      </svg>
      <div>
        <div class="big"><span id="tcount">0</span> <span style="font-size:18px;color:var(--sub)">/ <span id="tgoal">20</span></span></div>
        <div class="lbl">오늘 학습한 단어</div>
      </div>
    </div>
    <div class="streak">
      <span>🔥 연속 <b id="streak">0</b>일</span>
      <span style="color:var(--sub)" id="totdays">총 0일 학습</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-known" style="color:var(--ok)">0</b><span>아는 단어</span></div>
    <div class="stat"><b id="s-unk" style="color:var(--no)">0</b><span>모르는 단어</span></div>
    <div class="stat"><b id="s-new">0</b><span>안 본 단어</span></div>
  </div>

  <button class="btn" id="go">🎲 오늘 학습 시작</button>
  <div class="row" style="margin-top:9px">
    <button class="btn ghost" id="goRev">❗ 모르는 단어 복습</button>
    <button class="btn ghost" id="goAll">📚 단어장 열기</button>
  </div>
  <p class="muted" style="margin-top:14px;text-align:center;line-height:1.6">
    학습을 시작할 때마다 단어가 <b>새로 섞여서</b> 나옵니다.<br>
    이미 <b>알아요</b>로 체크한 단어는 다시 나오지 않아요.
  </p>
</section>

<!-- ============ LIST ============ -->
<section class="view" id="v-list">
  <h1>단어장</h1>
  <p class="muted" id="lcount"></p>
  <input class="search" id="q" placeholder="영어 또는 한글 뜻으로 검색" autocomplete="off" autocapitalize="off">
  <div class="chips" id="fil">
    <button class="chip on" data-f="all">전체</button>
    <button class="chip" data-f="unk">모르는 단어</button>
    <button class="chip" data-f="known">아는 단어</button>
    <button class="chip" data-f="new">안 본 단어</button>
  </div>
  <div class="chips" style="margin-top:8px">
    <button class="chip" data-lv="1">1단계</button>
    <button class="chip" data-lv="2">2단계</button>
    <button class="chip" data-lv="3">3단계</button>
  </div>
  <div id="list" style="margin-top:13px"></div>
  <div class="more" id="more" style="display:none"></div>
</section>

<!-- ============ CALENDAR ============ -->
<section class="view" id="v-cal">
  <h1>학습 달력</h1>
  <p class="muted">하루 목표를 채우면 도장이 찍혀요</p>
  <div class="card" style="margin-top:14px">
    <div class="calhd">
      <button id="pm">‹</button><b id="ym"></b><button id="nm">›</button>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="days" style="margin-top:5px"></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>목표 달성</span>
      <span><i style="background:#f5c65e"></i>일부 학습</span>
      <span><i style="background:var(--card);border:1px solid var(--line)"></i>미학습</span>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="m-days">0</b><span>이번 달 학습일</span></div>
    <div class="stat"><b id="m-words">0</b><span>이번 달 단어</span></div>
    <div class="stat"><b id="m-best">0</b><span>최장 연속일</span></div>
  </div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="view" id="v-set">
  <h1>설정</h1>
  <div class="card" style="margin-top:14px">
    <h2 style="margin-top:0">하루 목표</h2>
    <div class="chips" id="goals">
      <button class="chip" data-g="10">10개</button>
      <button class="chip" data-g="20">20개</button>
      <button class="chip" data-g="30">30개</button>
      <button class="chip" data-g="50">50개</button>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">학습 난이도</h2>
    <p class="muted" style="margin-bottom:9px">1단계 기초 · 2단계 표준 · 3단계 심화(내신 빈출)</p>
    <div class="chips" id="lvs">
      <button class="chip" data-l="1">1단계</button>
      <button class="chip" data-l="2">2단계</button>
      <button class="chip" data-l="3">3단계</button>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">발음</h2>
    <div class="chips" id="acc">
      <button class="chip" data-a="en-US">🇺🇸 미국식 우선</button>
      <button class="chip" data-a="en-GB">🇬🇧 영국식 우선</button>
    </div>
    <label class="sw" style="margin-top:6px"><span>단어 카드가 나오면 자동 발음</span>
      <input type="checkbox" id="autosay"></label>
    <div style="padding-top:6px">
      <div style="font-size:14.5px;margin-bottom:7px">말하기 속도 <b id="rateV">0.9</b>배</div>
      <input type="range" id="rate" min="0.5" max="1.2" step="0.05">
    </div>
    <button class="btn ghost sm" id="testsay" style="margin-top:12px">🔊 발음 테스트</button>
    <p class="muted" id="voiceinfo" style="margin-top:9px;line-height:1.55"></p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">학습 방식</h2>
    <label class="sw"><span>뜻을 처음부터 보여주기</span><input type="checkbox" id="autorev"></label>
  </div>
  <div class="card">
    <h2 style="margin-top:0">데이터</h2>
    <div class="row">
      <button class="btn ghost sm" id="exp">📥 백업 저장</button>
      <button class="btn ghost sm" id="imp">📤 백업 불러오기</button>
    </div>
    <button class="btn ghost sm" id="reset" style="margin-top:9px;color:var(--no)">전체 기록 초기화</button>
    <input type="file" id="impf" accept=".json" style="display:none">
  </div>
  <p class="muted" style="text-align:center;padding:6px 0 10px">총 <b id="totw">0</b>개 단어 수록</p>
</section>

</main>

<nav>
  <button class="on" data-v="home"><i>🏠</i>홈</button>
  <button data-v="list"><i>📚</i>단어장</button>
  <button data-v="cal"><i>📅</i>달력</button>
  <button data-v="set"><i>⚙️</i>설정</button>
</nav>
</div>

<!-- ============ STUDY OVERLAY ============ -->
<div id="study">
  <div class="stop">
    <button class="x" id="quit">×</button>
    <div class="bar"><i id="pbar" style="width:0"></i></div>
    <div class="n" id="pnum">0/0</div>
  </div>
  <div class="wrap" id="swrap"></div>
  <div class="ans" id="sans" style="display:none">
    <button class="no" id="bNo">✕ 몰라요</button>
    <button class="yes" id="bYes">✓ 알아요</button>
  </div>
</div>

<div id="sheet"><div class="in" id="sheetin"></div></div>

function get(k,d){try{var v=localStorage.getItem(k);if(v!=null)return JSON.parse(v);}catch(e){}
  return (k in mem)?mem[k]:d;}
function set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var S={
  known:get('vk',{}), unknown:get('vu',{}), days:get('vd',{}),
  goal:get('vgoal',20), levels:get('vlv',[1,2,3]), acc:get('vacc','en-US'),
  rate:get('vrate',.9), autoSay:get('vas',false), autoRev:get('var',false)
};
function save(){set('vk',S.known);set('vu',S.unknown);set('vd',S.days);}
function saveCfg(){set('vgoal',S.goal);set('vlv',S.levels);set('vacc',S.acc);
  set('vrate',S.rate);set('vas',S.autoSay);set('var',S.autoRev);}

/* ================= util ================= */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return [].slice.call(document.querySelectorAll(s))};
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return key(new Date())}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},1600);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ================= speech ================= */
var VOICES=[];
function loadV(){try{VOICES=window.speechSynthesis.getVoices()||[];}catch(e){VOICES=[];}}
if(window.speechSynthesis){loadV();window.speechSynthesis.onvoiceschanged=loadV;setTimeout(loadV,600);setTimeout(loadV,1800);}
var GOOD=/samantha|alex|allison|ava|nicky|aaron|daniel|kate|serena|oliver|arthur|martha|google|microsoft/i;
function pickV(lang){
  if(!VOICES.length)loadV();
  var L=lang.toLowerCase();
  var ex=VOICES.filter(function(v){return v.lang&&v.lang.replace('_','-').toLowerCase()===L});
  if(ex.length){var g=ex.filter(function(v){return GOOD.test(v.name)});return (g[0]||ex[0]);}
  var f=VOICES.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('en')===0});
  return f[0]||null;
}
function speak(text,lang){
  if(!window.speechSynthesis){toast('이 브라우저는 발음을 지원하지 않아요');return;}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=S.rate; u.pitch=1;
    var v=pickV(lang); if(v)u.voice=v;
    window.speechSynthesis.speak(u);
    setTimeout(function(){try{window.speechSynthesis.resume()}catch(e){}},110);
  }catch(e){}
}

/* ================= index ================= */
var BYW={}; WORDS.forEach(function(w){BYW[w.w]=w});
function stKnown(w){return !!S.known[w.w]}
function stUnk(w){return !!S.unknown[w.w]}
function inLv(w){return S.levels.indexOf(w.lv)>=0}

function dayCount(k){var d=S.days[k];return d?d.c:0}
function bump(){
  var k=today(); var d=S.days[k]||{c:0,g:S.goal};
  d.c++; d.g=S.goal; S.days[k]=d; save();
}
function streak(){
  var n=0,d=new Date();
  if(dayCount(key(d))<(S.days[key(d)]?S.days[key(d)].g:S.goal)) d.setDate(d.getDate()-1);
  for(var i=0;i<800;i++){
    var k=key(d), rec=S.days[k];
    if(rec&&rec.c>=rec.g){n++;d.setDate(d.getDate()-1);}else break;
  }
  return n;
}

/* ================= views ================= */
function show(v){
  $$('.view').forEach(function(e){e.classList.toggle('on',e.id==='v-'+v)});
  $$('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='home')drawHome(); if(v==='list')drawList(); if(v==='cal')drawCal(); if(v==='set')drawSet();
  document.querySelector('main').scrollTop=0;
}
$$('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});

function drawHome(){
  var d=new Date(), W=['일','월','화','수','목','금','토'];
  $('#today').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일 '+W[d.getDay()]+'요일';
  var c=dayCount(today()), g=S.goal;
  $('#tcount').textContent=c; $('#tgoal').textContent=g;
  var p=Math.min(1,c/g); $('#ringp').setAttribute('stroke-dashoffset',245-245*p);
  $('#ringp').setAttribute('stroke',c>=g?'#0ea472':'#635bff');
  $('#streak').textContent=streak();
  var td=0; for(var k in S.days){if(S.days[k].c>0)td++;}
  $('#totdays').textContent='총 '+td+'일 학습';
  var kn=0,un=0; for(var a in S.known)if(BYW[a])kn++; for(var b in S.unknown)if(BYW[b]&&!S.known[b])un++;
  $('#s-known').textContent=kn; $('#s-unk').textContent=un;
  $('#s-new').textContent=WORDS.length-kn-un;
  $('#go').textContent = c>=g ? '🎉 목표 달성! 추가 학습하기' : (c>0?'🎲 이어서 학습하기 ('+(g-c)+'개 남음)':'🎲 오늘 학습 시작');
}

/* ---------- study ---------- */
var Q=[],qi=0,revealed=false,mode='new';
function buildQ(m){
  mode=m;
  var pool=WORDS.filter(inLv);
  if(m==='rev'){
    Q=shuffle(pool.filter(function(w){return stUnk(w)&&!stKnown(w)})).slice(0,Math.max(S.goal,10));
    if(!Q.length){toast('모르는 단어가 없어요 👍');return false;}
    return true;
  }
  var left=Math.max(S.goal-dayCount(today()),0); if(left<=0)left=10;
  var unk=shuffle(pool.filter(function(w){return stUnk(w)&&!stKnown(w)}));
  var fresh=shuffle(pool.filter(function(w){return !stKnown(w)&&!stUnk(w)}));
  var nRev=Math.min(unk.length,Math.round(left*0.3));
  Q=unk.slice(0,nRev).concat(fresh.slice(0,left-nRev));
  if(Q.length<left)Q=Q.concat(unk.slice(nRev,nRev+(left-Q.length)));
  if(!Q.length){
    var all=shuffle(pool.filter(function(w){return stKnown(w)}));
    Q=all.slice(0,left);
    if(!Q.length){toast('선택한 난이도에 단어가 없어요');return false;}
    toast('모든 단어를 익혔어요! 복습으로 진행합니다');
  }
  Q=shuffle(Q); return true;
}
function openStudy(m){ if(!buildQ(m))return; qi=0; $('#study').classList.add('on'); card(); }
function closeStudy(){ $('#study').classList.remove('on'); try{speechSynthesis.cancel()}catch(e){} drawHome(); }
$('#quit').onclick=closeStudy;
$('#go').onclick=function(){openStudy('new')};
$('#goRev').onclick=function(){openStudy('rev')};
$('#goAll').onclick=function(){show('list')};

function card(){
  if(qi>=Q.length){finish();return;}
  var w=Q[qi]; revealed=S.autoRev;
  $('#pnum').textContent=(qi+1)+'/'+Q.length;
  $('#pbar').style.width=(qi/Q.length*100)+'%';
  $('#sans').style.display='flex';
  $('#swrap').innerHTML=
    '<div class="wcard">'+
      '<div class="emo">'+w.m+'</div>'+
      '<div class="word">'+esc(w.w)+'</div>'+
      '<div class="tags"><span class="pill">'+esc(w.p)+'</span><span class="pill lv'+w.lv+'">'+w.lv+'단계</span><span class="pill">'+esc(w.c)+'</span></div>'+
      '<div class="say"><button data-s="us">🇺🇸 미국식</button><button data-s="gb">🇬🇧 영국식</button></div>'+
      (revealed? rev(w) : '<div class="tapme" id="tap">👆 눌러서 뜻 확인하기</div>')+
    '</div>';
  bind(w);
  if(S.autoSay)setTimeout(function(){speak(w.w,S.acc)},260);
  $('#swrap').scrollTop=0;
}
function rev(w){
  return '<div class="reveal">'+
    '<div class="mean">'+esc(w.k)+'</div>'+
    '<div class="ex"><div class="en">'+esc(w.e)+'</div><div class="ko">'+esc(w.t)+'</div>'+
    '<div class="sayex"><button data-x="us">🔊 예문 미국식</button><button data-x="gb">🔊 예문 영국식</button></div></div></div>';
}
function bind(w){
  $$('#swrap [data-s]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();
    speak(w.w,b.dataset.s==='us'?'en-US':'en-GB')}});
  $$('#swrap [data-x]').forEach(function(b){b.onclick=function(ev){ev.stopPropagation();
    speak(w.e,b.dataset.x==='us'?'en-US':'en-GB')}});
  var t=$('#tap'); if(t)t.onclick=function(){
    revealed=true;
    t.outerHTML=rev(w); bind(w);
  };
}
function answer(ok){
  var w=Q[qi]; if(!w)return;
  if(ok){S.known[w.w]=1; delete S.unknown[w.w];}
  else{S.unknown[w.w]=1; delete S.known[w.w];}
  bump();
  var c=dayCount(today());
  if(c===S.goal)toast('🎉 오늘 목표 '+S.goal+'개 달성!');
  qi++; card();
}
$('#bYes').onclick=function(){answer(true)};
$('#bNo').onclick=function(){answer(false)};
document.addEventListener('keydown',function(e){
  if(!$('#study').classList.contains('on'))return;
  if(e.key==='ArrowRight'||e.key==='2')answer(true);
  if(e.key==='ArrowLeft'||e.key==='1')answer(false);
  if(e.key===' '){e.preventDefault();var t=$('#tap');if(t)t.click();}
});
/* swipe */
var sx=0,sy=0;
$('#swrap').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#swrap').addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)answer(dx>0);
},{passive:true});

function finish(){
  $('#sans').style.display='none';
  $('#pbar').style.width='100%'; $('#pnum').textContent=Q.length+'/'+Q.length;
  var c=dayCount(today()), done=c>=S.goal;
  $('#swrap').innerHTML='<div class="wcard done"><div class="m">'+(done?'🎉':'👏')+'</div>'+
    '<h3>'+(done?'오늘 목표 달성!':'수고했어요!')+'</h3>'+
    '<p class="muted">오늘 '+c+'개 학습 · 목표 '+S.goal+'개</p>'+
    '<p class="muted" style="margin-top:6px">🔥 연속 '+streak()+'일</p>'+
    '<div style="margin-top:22px"><button class="btn" id="again">🎲 새로 섞어서 더 하기</button>'+
    '<button class="btn ghost" id="hm" style="margin-top:9px">홈으로</button></div></div>';
  $('#again').onclick=function(){openStudy(mode==='rev'?'rev':'new')};
  $('#hm').onclick=closeStudy;
}

/* ---------- list ---------- */
var F='all',LV=[],LIMIT=60;
function drawList(){
  LIMIT=60; render();
}
function filtered(){
  var q=$('#q').value.trim().toLowerCase();
  return WORDS.filter(function(w){
    if(LV.length&&LV.indexOf(w.lv)<0)return false;
    if(F==='unk'&&!(S.unknown[w.w]&&!S.known[w.w]))return false;
    if(F==='known'&&!S.known[w.w])return false;
    if(F==='new'&&(S.known[w.w]||S.unknown[w.w]))return false;
    if(q&&w.w.indexOf(q)<0&&w.k.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function render(){
  var r=filtered();
  $('#lcount').textContent=r.length.toLocaleString()+'개';
  var sl=r.slice(0,LIMIT);
  $('#list').innerHTML=sl.map(function(w){
    var s=S.known[w.w]?'✅':(S.unknown[w.w]?'❌':'⚪️');
    return '<div class="item" data-w="'+esc(w.w)+'"><div class="e">'+w.m+'</div>'+
      '<div class="t"><b>'+esc(w.w)+'</b><span>'+esc(w.k)+'</span></div>'+
      '<div class="s">'+s+'</div></div>';
  }).join('')||'<p class="muted" style="text-align:center;padding:26px">해당하는 단어가 없어요</p>';
  $$('#list .item').forEach(function(el){el.onclick=function(){sheet(BYW[el.dataset.w])}});
  var m=$('#more');
  if(r.length>LIMIT){m.style.display='block';m.textContent='+ '+(r.length-LIMIT)+'개 더 보기';
    m.onclick=function(){LIMIT+=100;render()};}
  else m.style.display='none';
}
$('#q').oninput=function(){LIMIT=60;render()};
$$('#fil .chip').forEach(function(b){b.onclick=function(){
  F=b.dataset.f;$$('#fil .chip').forEach(function(x){x.classList.toggle('on',x===b)});LIMIT=60;render();}});
$$('[data-lv]').forEach(function(b){b.onclick=function(){
  var v=+b.dataset.lv,i=LV.indexOf(v); if(i<0)LV.push(v);else LV.splice(i,1);
  b.classList.toggle('on');LIMIT=60;render();}});

function sheet(w){
  if(!w)return;
  var st=S.known[w.w]?'known':(S.unknown[w.w]?'unk':'new');
  $('#sheetin').innerHTML=
   '<div style="text-align:center"><div style="font-size:62px;line-height:1">'+w.m+'</div>'+
   '<div style="font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:8px">'+esc(w.w)+'</div>'+
   '<div class="tags" style="margin-top:9px"><span class="pill">'+esc(w.p)+'</span>'+
   '<span class="pill lv'+w.lv+'">'+w.lv+'단계</span><span class="pill">'+esc(w.c)+'</span></div>'+
   '<div style="font-size:20px;font-weight:700;margin:16px 0 4px">'+esc(w.k)+'</div>'+
   '<div class="say"><button data-s="us">🇺🇸 미국식</button><button data-s="gb">🇬🇧 영국식</button></div></div>'+
   '<div class="ex" style="margin-top:16px"><div class="en">'+esc(w.e)+'</div><div class="ko">'+esc(w.t)+'</div>'+
   '<div class="sayex"><button data-x="us">🔊 예문 미국식</button><button data-x="gb">🔊 예문 영국식</button></div></div>'+
   '<div class="row" style="margin-top:14px">'+
   '<button class="btn ghost sm" id="mk-no" style="color:var(--no)'+(st==='unk'?';background:var(--nobg)':'')+'">✕ 몰라요</button>'+
   '<button class="btn ghost sm" id="mk-ok" style="color:var(--ok)'+(st==='known'?';background:var(--okbg)':'')+'">✓ 알아요</button></div>'+
   '<button class="btn ghost sm" id="cl" style="margin-top:9px">닫기</button>';
  $('#sheet').classList.add('on');
  $$('#sheetin [data-s]').forEach(function(b){b.onclick=function(){speak(w.w,b.dataset.s==='us'?'en-US':'en-GB')}});
  $$('#sheetin [data-x]').forEach(function(b){b.onclick=function(){speak(w.e,b.dataset.x==='us'?'en-US':'en-GB')}});
  $('#mk-ok').onclick=function(){S.known[w.w]=1;delete S.unknown[w.w];save();close_();render();toast('아는 단어로 저장했어요')};
  $('#mk-no').onclick=function(){S.unknown[w.w]=1;delete S.known[w.w];save();close_();render();toast('모르는 단어로 저장했어요')};
  $('#cl').onclick=close_;
  function close_(){$('#sheet').classList.remove('on')}
}
$('#sheet').onclick=function(e){if(e.target===$('#sheet'))$('#sheet').classList.remove('on')};

/* ---------- calendar ---------- */
var CM=new Date(); CM.setDate(1);
function drawCal(){
  var W=['일','월','화','수','목','금','토'];
  $('#dows').innerHTML=W.map(function(d){return '<div class="dow">'+d+'</div>'}).join('');
  $('#ym').textContent=CM.getFullYear()+'년 '+(CM.getMonth()+1)+'월';
  var first=new Date(CM.getFullYear(),CM.getMonth(),1);
  var last=new Date(CM.getFullYear(),CM.getMonth()+1,0).getDate();
  var h='',tk=today(),md=0,mw=0;
  for(var i=0;i<first.getDay();i++)h+='<div class="day empty"></div>';
  for(var d=1;d<=last;d++){
    var k=CM.getFullYear()+'-'+pad(CM.getMonth()+1)+'-'+pad(d);
    var r=S.days[k], cls='day', mark='';
    if(r&&r.c>0){md++;mw+=r.c;
      if(r.c>=r.g){cls+=' full';mark='<div class="k">✓</div>';}
      else{cls+=' part';mark='<div class="k" style="font-size:10px">'+r.c+'</div>';}
    }
    if(k===tk)cls+=' today';
    h+='<div class="'+cls+'"><div>'+d+'</div>'+mark+'</div>';
  }
  $('#days').innerHTML=h;
  $('#m-days').textContent=md; $('#m-words').textContent=mw;
  $('#m-best').textContent=best();
}
function best(){
  var ks=Object.keys(S.days).filter(function(k){var r=S.days[k];return r.c>=r.g}).sort();
  var b=0,run=0,prev=null;
  ks.forEach(function(k){
    var d=new Date(k+'T00:00:00');
    if(prev&&(d-prev)===86400000)run++;else run=1;
    prev=d; if(run>b)b=run;
  });
  return b;
}
$('#pm').onclick=function(){CM.setMonth(CM.getMonth()-1);drawCal()};
$('#nm').onclick=function(){CM.setMonth(CM.getMonth()+1);drawCal()};

/* ---------- settings ---------- */
function drawSet(){
  $$('#goals .chip').forEach(function(b){b.classList.toggle('on',+b.dataset.g===S.goal)});
  $$('#lvs .chip').forEach(function(b){b.classList.toggle('on',S.levels.indexOf(+b.dataset.l)>=0)});
  $$('#acc .chip').forEach(function(b){b.classList.toggle('on',b.dataset.a===S.acc)});
  $('#rate').value=S.rate; $('#rateV').textContent=S.rate;
  $('#autosay').checked=S.autoSay; $('#autorev').checked=S.autoRev;
  $('#totw').textContent=WORDS.length.toLocaleString();
  loadV();
  var us=pickV('en-US'), gb=pickV('en-GB');
  $('#voiceinfo').innerHTML='기기 음성: 미국식 '+(us?'<b>'+esc(us.name)+'</b>':'없음(영어 기본음성 사용)')+
    ' · 영국식 '+(gb?'<b>'+esc(gb.name)+'</b>':'없음(영어 기본음성 사용)')+
    '<br>영국식이 안 나오면 아이폰 <b>설정 › 손쉬운 사용 › 음성 콘텐츠 › 음성 › English (UK)</b> 에서 음성을 내려받으세요.';
}
$$('#goals .chip').forEach(function(b){b.onclick=function(){S.goal=+b.dataset.g;saveCfg();drawSet();toast('하루 목표 '+S.goal+'개')}});
$$('#lvs .chip').forEach(function(b){b.onclick=function(){
  var v=+b.dataset.l,i=S.levels.indexOf(v);
  if(i<0)S.levels.push(v); else if(S.levels.length>1)S.levels.splice(i,1); else return toast('최소 1개는 선택해야 해요');
  saveCfg();drawSet();}});
$$('#acc .chip').forEach(function(b){b.onclick=function(){S.acc=b.dataset.a;saveCfg();drawSet()}});
$('#rate').oninput=function(){S.rate=+this.value;$('#rateV').textContent=S.rate;saveCfg()};
$('#autosay').onchange=function(){S.autoSay=this.checked;saveCfg()};
$('#autorev').onchange=function(){S.autoRev=this.checked;saveCfg()};
$('#testsay').onclick=function(){speak('This is an English pronunciation test.',S.acc)};
$('#exp').onclick=function(){
  var blob=new Blob([JSON.stringify({k:S.known,u:S.unknown,d:S.days,g:S.goal})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='voca-backup-'+today()+'.json';a.click();toast('백업 파일을 저장했어요');
};
$('#imp').onclick=function(){$('#impf').click()};
$('#impf').onchange=function(){
  var f=this.files[0]; if(!f)return; var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);
    S.known=o.k||{};S.unknown=o.u||{};S.days=o.d||{};if(o.g)S.goal=o.g;
    save();saveCfg();drawSet();toast('백업을 불러왔어요');}catch(e){toast('파일을 읽을 수 없어요')}};
  r.readAsText(f);
};
$('#reset').onclick=function(){
  if(!confirm('학습 기록(아는 단어·모르는 단어·달력)이 모두 지워집니다. 계속할까요?'))return;
  S.known={};S.unknown={};S.days={};save();drawSet();toast('초기화했어요');
};

/* ---------- boot ---------- */
show('home');
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
})();
</script>
